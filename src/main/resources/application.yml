spring:
  application:
    name: picture-compressor
  webflux:
    multipart:
      max-in-memory-size: 5MB
      max-headers-size: 1MB
      max-disk-usage-per-part: 5MB
      max-parts: 5
  # CORS configuration
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "*"
    allow-credentials: false
    max-age: 3600

# Logging configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  max-http-request-header-size: 1MB
  # Netty-specific timeout settings
  netty:
    connection-timeout: 60s
  http2:
    enabled: false

# SpringDoc/Swagger UI configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Rate limiting configuration - reduce for constrained environment
rate-limiting:
  requests-per-minute: 5

# GIF compression configuration - adjust for constrained environment
gif-compression:
  max-file-size: 5242880  # 5MB in bytes
  max-memory-percent: 70  # More conservative memory usage
  estimated-memory-factor: 3.5
  # Add new constrained environment settings
  constrained-mode: false
  max-batch-size: 3
  max-parallel-frames: 2

# Gifsicle configuration - внешняя утилита для сжатия GIF с низким потреблением памяти
gifsicle:
  # Путь к исполняемому файлу, по умолчанию предполагается, что он доступен в PATH
  path: gifsicle
  # Таймаут выполнения в секундах
  timeout-seconds: 30
  # Уровень оптимизации (1-3), где 3 - максимальный
  optimization-level: 3
  # Уровень потери качества (0-100), где 0 - без потерь, больше означает больше потерь и меньший размер
  lossy-level: 30
  # Использовать ли сжатие с потерями
  use-lossy: true
  # Включить Gifsicle как основной процессор (если false, используется как запасной)
  enabled: true

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        memory:
          show-details: always
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
        
# Resilience4j configuration - more conservative for constrained environment
resilience4j:
  circuitbreaker:
    instances:
      compressionService:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  bulkhead:
    instances:
      compressionService:
        maxConcurrentCalls: 3  # Reduced concurrent calls
        maxWaitDuration: 10s
  ratelimiter:
    instances:
      compressionService:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
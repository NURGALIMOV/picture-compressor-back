spring:
  application:
    name: picture-compressor

  # CORS configuration
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "*"
    allow-credentials: false
    max-age: 3600

# Logging configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  netty:
    connection-timeout: 60s
  http2:
    enabled: true
  forward-headers-strategy: framework

# SpringDoc/Swagger UI configuration
# http://localhost:8080/swagger-ui

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: https://picture-compressor-back-production-782c.up.railway.app/v3/api-docs
  api-docs:
    path: /v3/api-docs

# Rate limiting configuration - reduce for constrained environment
rate-limiting:
  requests-per-minute: 1200  # 20 RPS per second, with burst for 1000 RPS

# GIF compression configuration - adjust for constrained environment
gif-compression:
  max-file-size: 10485760  # 10MB in bytes
  max-memory-percent: 70   # 70% of 1GB
  estimated-memory-factor: 3
  max-batch-size: 10

gifsicle:
  path: gifsicle
  timeout-seconds: 30
  optimization-level: 3
  use-lossy: true

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      compressionService:
        slidingWindowSize: 20
        permittedNumberOfCallsInHalfOpenState: 50
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  bulkhead:
    instances:
      compressionService:
        maxConcurrentCalls: 40
        maxWaitDuration: 5s
  ratelimiter:
    instances:
      compressionService:
        limitForPeriod: 1000
        limitRefreshPeriod: 1s
        timeoutDuration: 2s
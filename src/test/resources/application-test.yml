spring:
  application:
    name: picture-compressor
  webflux:
    multipart:
      max-in-memory-size: 200MB
      max-headers-size: 1MB
      max-disk-usage-per-part: 200MB
      max-parts: 10
  # CORS configuration
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "*"
    allow-credentials: false
    max-age: 3600

server:
  port: 8080
  max-http-request-header-size: 1MB

# Rate limiting configuration
rate-limiting:
  requests-per-minute: 10

# GIF compression configuration
gif-compression:
  max-file-size: 209715200  # 200MB in bytes
  max-memory-percent: 90    # Менее строгое значение для тестов
  estimated-memory-factor: 3.5
  constrained-mode: false
  max-batch-size: 10
  max-parallel-frames: 4

# Disable logging for tests
logging:
  level:
    root: OFF
    org.springframework: OFF
    com.example: OFF

# Actuator configuration for tests
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Resilience4j configuration for tests
resilience4j:
  circuitbreaker:
    instances:
      compressionService:
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 1s
        failureRateThreshold: 50
  bulkhead:
    instances:
      compressionService:
        maxConcurrentCalls: 20
        maxWaitDuration: 5s
  ratelimiter:
    instances:
      compressionService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 3s